# This rule is not used by the project configmap-updater itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the ops.ops.example.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: configmap-updater
    app.kubernetes.io/managed-by: kustomize
  name: configmapupdater-editor-role
rules:
- apiGroups:
  - ops.ops.example.io
  resources:
  - configmapupdaters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ops.ops.example.io
  resources:
  - configmapupdaters/status
  verbs:
  - get
