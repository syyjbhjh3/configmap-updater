# This rule is not used by the project configmap-updater itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to ops.ops.example.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: configmap-updater
    app.kubernetes.io/managed-by: kustomize
  name: destinationcluster-viewer-role
rules:
- apiGroups:
  - ops.ops.example.io
  resources:
  - destinationclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ops.ops.example.io
  resources:
  - destinationclusters/status
  verbs:
  - get
